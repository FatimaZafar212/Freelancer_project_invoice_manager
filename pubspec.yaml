name: freelancer_project_invoice_manager
description: "A Flutter app to manage freelancer projects and invoices"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI & Utils
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  intl: ^0.20.2

  # Firebase (stable compatible versions)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true